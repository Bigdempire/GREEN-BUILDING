<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoBuild - Create Account</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">🌿 EcoBuild</a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <main class="section-block">
    <section class="form-card" style="max-width: 620px; margin: 0 auto;">
      <p class="status-pill">Create your account</p>
      <h1 class="page-title">Register for EcoBuild</h1>
      <p class="text-muted">Choose your account type and complete the quick registration form.</p>

      <form id="authForm" data-type="signup">
        <div class="form-grid signup-type" style="margin-bottom: 22px;">
          <label class="input-group" style="padding: 18px; border: 1px solid var(--border); border-radius: 18px;">
            <input type="radio" name="role" value="buyer" checked style="margin-right: 10px;" /> Buyer account
          </label>
          <label class="input-group" style="padding: 18px; border: 1px solid var(--border); border-radius: 18px;">
            <input type="radio" name="role" value="supplier" style="margin-right: 10px;" /> Supplier account
          </label>
          <label class="input-group" style="padding: 18px; border: 1px solid var(--border); border-radius: 18px;">
            <input type="radio" name="role" value="admin" style="margin-right: 10px;" /> Admin account
          </label>
        </div>
        <div class="buyer-fields">
          <div class="form-grid">
            <div class="input-group">
              <label for="full_name">Full name</label>
              <input id="full_name" name="full_name" type="text" placeholder="John Doe" />
            </div>
            <div class="input-group">
              <label for="organization">Organization</label>
              <input id="organization" name="organization" type="text" placeholder="Your company or project" />
            </div>
            <div class="input-group">
              <label for="phone">Phone number</label>
              <input id="phone" name="phone" type="tel" placeholder="+255 712 345 678" />
            </div>
          </div>
        </div>

        <div class="supplier-fields" style="display:none;">
          <div class="form-grid">
            <div class="input-group">
              <label for="company">Company name</label>
              <input id="company" name="company" type="text" placeholder="EcoBuild Ltd." />
            </div>
            <div class="input-group">
              <label for="location">Location</label>
              <input id="location" name="location" type="text" placeholder="Dar es Salaam, Tanzania" />
            </div>
            <div class="input-group">
              <label for="phone_supplier">Phone number</label>
              <input id="phone_supplier" name="supplier_phone" type="tel" placeholder="+255 712 345 678" />
            </div>
          </div>
        </div>
        <div class="admin-fields" style="display:none;">
          <div class="form-grid">
            <div class="input-group">
              <label for="admin_name">Admin full name</label>
              <input id="admin_name" name="full_name" type="text" placeholder="Admin User" />
            </div>
          </div>
        </div>

        <div class="form-grid">
          <div class="input-group">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" required />
          </div>
          <div class="input-group">
            <label for="password">Create password</label>
            <input id="password" name="password" type="password" placeholder="••••••••" required />
          </div>
        </div>

        <button type="submit">Create account</button>
      </form>

      <p class="text-muted" style="margin-top: 18px; text-align: center;">Already have an account? <a href="login.html">Sign in</a></p>
    </section>
  </main>

  <footer class="site-footer">© 2026 EcoBuild. Build better, greener, and faster.</footer>

  <script src="app.js"></script>
  <script src="auth.js"></script>
  <script>
    const buyerFields = document.querySelector('.buyer-fields');
    const supplierFields = document.querySelector('.supplier-fields');
    const adminFields = document.querySelector('.admin-fields');
    const roleRadios = document.querySelectorAll('input[name="role"]');

    const updateRole = () => {
      const selectedRole = document.querySelector('input[name="role"]:checked').value;
      buyerFields.style.display = selectedRole === 'buyer' ? 'block' : 'none';
      supplierFields.style.display = selectedRole === 'supplier' ? 'block' : 'none';
      adminFields.style.display = selectedRole === 'admin' ? 'block' : 'none';
    };

    roleRadios.forEach(radio => radio.addEventListener('change', updateRole));
    updateRole();
  </script>
</body>
</html>
